[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends()/Query() en defaults es el idioma de FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: integración con PostgreSQL nativo; requiere VISION_TEST_POSTGRES_URL (ver docs/postgres-windows.md)"]
